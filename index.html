<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 종합 금융 대시보드</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.8rem; margin-bottom: 5px; letter-spacing: -0.5px; }
        .timestamp-container { display: flex; align-items: center; gap: 10px; margin-bottom: 40px; color: var(--text-sub); font-size: 0.9rem; }
        .dashboard-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            width: 100%; 
            max-width: 1200px; 
        }
        .card { 
            background-color: var(--card-bg); 
            border-radius: 16px; 
            padding: 15px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            height: 140px;
            position: relative;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <h1>Global & Domestic Market Dashboard</h1>
    <div class="timestamp-container">
        <div id="time-text">🟢 트레이딩뷰 위젯 라이브 전용 데이터 채널 연결 성공</div>
    </div>

    <div class="dashboard-container">
        <!-- 코스피 지수 -->
        <div class="card">
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://tradingview.com" async>
                {
                "symbol": "KRX:KOSPI", "width": "100%", "height": "100%", "locale": "ko", "dateRange": "1D", "colorTheme": "dark", "isTransparent": true, "autosize": true, "largeChartUrl": ""
                }
                </script>
            </div>
        </div>

        <!-- 삼성전자 -->
        <div class="card">
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://tradingview.com" async>
                {
                "symbol": "KRX:005930", "width": "100%", "height": "100%", "locale": "ko", "dateRange": "1D", "colorTheme": "dark", "isTransparent": true, "autosize": true, "largeChartUrl": ""
                }
                </script>
            </div>
        </div>

        <!-- SK하이닉스 -->
        <div class="card">
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://tradingview.com" async>
                {
                "symbol": "KRX:000660", "width": "100%", "height": "100%", "locale": "ko", "dateRange": "1D", "colorTheme": "dark", "isTransparent": true, "autosize": true, "largeChartUrl": ""
                }
                </script>
            </div>
        </div>

        <!-- 나스닥 종합지수 -->
        <div class="card">
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://tradingview.com" async>
                {
                "symbol": "NASDAQ:IXIC", "width": "100%", "height": "100%", "locale": "ko", "dateRange": "1D", "colorTheme": "dark", "isTransparent": true, "autosize": true, "largeChartUrl": ""
                }
                </script>
            </div>
        </div>

        <!-- 필라델피아 반도체 -->
        <div class="card">
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://tradingview.com" async>
                {
                "symbol": "PHLX:SOX", "width": "100%", "height": "100%", "locale": "ko", "dateRange": "1D", "colorTheme": "dark", "isTransparent": true, "autosize": true, "largeChartUrl": ""
                }
                </script>
            </div>
        </div>

        <!-- 원/달러 환율 -->
        <div class="card">
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://tradingview.com" async>
                {
                "symbol": "FX_IDC:USDKRW", "width": "100%", "height": "100%", "locale": "ko", "dateRange": "1D", "colorTheme": "dark", "isTransparent": true, "autosize": true, "largeChartUrl": ""
                }
                </script>
            </div>
        </div>

        <!-- 국제 유가 (WTI) -->
        <div class="card">
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://tradingview.com" async>
                {
                "symbol": "NYMEX:CL1!", "width": "100%", "height": "100%", "locale": "ko", "dateRange": "1D", "colorTheme": "dark", "isTransparent": true, "autosize": true, "largeChartUrl": ""
                }
                </script>
            </div>
        </div>
    </div>

</body>
</html>
