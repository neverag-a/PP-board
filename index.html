<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 종합 금융 대시보드</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.8rem; margin-bottom: 5px; letter-spacing: -0.5px; }
        .timestamp-container { display: flex; align-items: center; gap: 10px; margin-bottom: 40px; color: var(--text-sub); font-size: 0.9rem; }
        .dashboard-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            width: 100%; 
            max-width: 1200px; 
        }
        .card { 
            background-color: var(--card-bg); 
            border-radius: 16px; 
            padding: 15px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            height: 140px;
            box-sizing: border-box;
        }
        /* 위젯 내부 크기를 카드에 꽉 맞추는 스타일 */
        tv-mini-chart {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
    <!-- 트레이딩뷰 최신 표준 글로벌 웹 컴포넌트 라이브러리 로드 -->
    <script type="module" src="https://tradingview-widget.com"></script>
</head>
<body>

    <h1>Global & Domestic Market Dashboard</h1>
    <div class="timestamp-container">
        <div id="time-text">🟢 글로벌 금융 표준 웹 컴포넌트 연동 성공 (실시간 무한 동기화)</div>
    </div>

    <div class="dashboard-container">
        <!-- 코스피 지수 -->
        <div class="card">
            <tv-mini-chart symbol="KRX:KOSPI" theme="dark" timeFrame="1D" chartType="area" isTransparent="true"></tv-mini-chart>
        </div>

        <!-- 삼성전자 -->
        <div class="card">
            <tv-mini-chart symbol="KRX:005930" theme="dark" timeFrame="1D" chartType="area" isTransparent="true"></tv-mini-chart>
        </div>

        <!-- SK하이닉스 -->
        <div class="card">
            <tv-mini-chart symbol="KRX:000660" theme="dark" timeFrame="1D" chartType="area" isTransparent="true"></tv-mini-chart>
        </div>

        <!-- 나스닥 종합지수 -->
        <div class="card">
            <tv-mini-chart symbol="NASDAQ:IXIC" theme="dark" timeFrame="1D" chartType="area" isTransparent="true"></tv-mini-chart>
        </div>

        <!-- 필라델피아 반도체 -->
        <div class="card">
            <tv-mini-chart symbol="PHLX:SOX" theme="dark" timeFrame="1D" chartType="area" isTransparent="true"></tv-mini-chart>
        </div>

        <!-- 원/달러 환율 -->
        <div class="card">
            <tv-mini-chart symbol="FX_IDC:USDKRW" theme="dark" timeFrame="1D" chartType="area" isTransparent="true"></tv-mini-chart>
        </div>

        <!-- 국제 유가 (WTI) -->
        <div class="card">
            <tv-mini-chart symbol="NYMEX:CL1!" theme="dark" timeFrame="1D" chartType="area" isTransparent="true"></tv-mini-chart>
        </div>
    </div>

</body>
</html>
