<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 종합 금융 대시보드</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.8rem; margin-bottom: 5px; letter-spacing: -0.5px; }
        .timestamp-container { display: flex; align-items: center; gap: 10px; margin-bottom: 40px; color: var(--text-sub); font-size: 0.9rem; }
        .dashboard-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            width: 100%; 
            max-width: 1200px; 
        }
        .card { 
            background-color: var(--card-bg); 
            border-radius: 16px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            height: 160px;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }
        /* 깃허브 보안 필터를 패스하는 격리형 임베드 창 스타일 */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <h1>Global & Domestic Market Dashboard</h1>
    <div class="timestamp-container">
        <div id="time-text">🟢 정식 임베드 보안 채널 가동 (실시간 라이브 스트리밍)</div>
    </div>

    <div class="dashboard-container">
        <!-- 코스피 지수 -->
        <div class="card">
            <iframe src="https://tradingview.com"></iframe>
        </div>

        <!-- 삼성전자 -->
        <div class="card">
            <iframe src="https://tradingview.com"></iframe>
        </div>

        <!-- SK하이닉스 -->
        <div class="card">
            <iframe src="https://tradingview.com"></iframe>
        </div>

        <!-- 나스닥 종합지수 -->
        <div class="card">
            <iframe src="https://tradingview.com"></iframe>
        </div>

        <!-- 필라델피아 반도체 -->
        <div class="card">
            <iframe src="https://tradingview.com"></iframe>
        </div>

        <!-- 원/달러 환율 -->
        <div class="card">
            <iframe src="https://tradingview.com"></iframe>
        </div>

        <!-- 국제 유가 (WTI) -->
        <div class="card">
            <iframe src="https://tradingview.com"></iframe>
        </div>
    </div>

</body>
</html>
